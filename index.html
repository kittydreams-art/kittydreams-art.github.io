<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kittydreams Art | 個人作品集</title>
    <style>
        /* 這裡就是 CSS：用來控制網頁的顏色與外觀 */
        body {
            background-color: #1e1e24; /* 網頁背景改成深灰色 */
            color: #ffffff;           /* 文字顏色改成白色 */
            font-family: "Microsoft JhengHei", sans-serif; /* 微軟正黑體 */
            text-align: center;       /* 讓所有文字置中 */
            padding: 50px 20px;
        }
        .profile-img {
            width: 150px;             /* 限制圖片寬度 150 像素 */
            height: 150px;
            border-radius: 50%;       /* 把圖片變成完美的圓形 */
            border: 3px solid #ff6b6b; /* 給圖片加上粉紅色的邊框 */
            object-fit: cover;
        }
        h1 {
            color: #ff6b6b;           /* 讓大標題變成漂亮的粉紅色 */
            margin-top: 20px;
        }
        p {
            font-size: 18px;
            color: #cccccc;           /* 副標題用稍微淡一點的灰色 */
        }
        .btn {
            display: inline-block;
            background-color: #ff6b6b;
            color: white;
            text-decoration: none;    /* 拔除超連結的下底線 */
            padding: 10px 20px;
            border-radius: 25px;      /* 讓按鈕邊角圓潤 */
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;         /* 讓滑鼠移過去的特效平滑 */
        }
        .btn:hover {
            background-color: #ff4757; /* 滑鼠移上去時按鈕變深色 */
        }
    </style>
</head>
<body>

    <!-- 1. 圖片標籤：這裡直接讀取剛才上傳的 Hello Kitty 圖片 -->
    <img src="kitty1151016-1.jpg" alt="Hello Kitty 頭像" class="profile-img">

    <!-- 2. 文字內容 -->
    <h1>潘華興的Kittydreams Art</h1>
    <p>歡迎來到我的個人藝術與程式設計空間！</p>
    <p>這是我的第一個透過 GitHub Pages 建立的免費網站。</p>

    <!-- 3. 超連結按鈕：點擊後直接在同分頁切換至台水深夜施工安全系統 -->
    <a href="water.html" class="btn">瀏覽我的 GitHub首發作品</a>

</body>
</html>
